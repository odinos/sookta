[versions]
agp = "8.7.3"
kotlin = "2.0.21" # UPDATED: Aligned with Compose Compiler
ksp = "2.0.21-1.0.25" # ADDED: KSP version
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
